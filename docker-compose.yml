services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_USER: home
      MYSQL_PASSWORD: home
      MYSQL_DATABASE: home
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3333:3306"
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot service: applies pending prisma migrations, then exits.
  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: mysql://root:root@db:3306/home
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://home:home@db:3306/home
      # Served over plain http by default. Behind a TLS proxy that sends
      # x-forwarded-proto nothing is needed; otherwise set PUBLIC_SCHEME=https.
      PUBLIC_SCHEME: http
    ports:
      - "3373:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  database:
