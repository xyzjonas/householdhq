name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholder so `prisma generate` / `nuxt build` pass without a database
  DATABASE_URL: "mysql://rubbish@just/so-that-the#build-passes"

jobs:
  checks:
    name: Typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci # runs `nuxt prepare` via postinstall

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx nuxt typecheck

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

  docker:
    name: Push Docker image to Docker Hub
    needs: checks
    # Only on merges/pushes to main, never on pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: scotch3840/householdhq:latest
